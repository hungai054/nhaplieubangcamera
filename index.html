<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo quét chữ bằng camera</title>
<style>
  body{font:16px/1.5 system-ui,sans-serif;max-width:560px;margin:24px auto;padding:0 16px}
  label{display:block;margin:16px 0 4px;font-weight:600}
  .field{display:flex;align-items:center}
  input[type=text]{flex:1;padding:8px;font:inherit;border:1px solid #9ca3af;border-radius:6px;min-width:0}
  code{background:#f3f4f6;padding:1px 4px;border-radius:4px}
</style>
</head>
<body>
<h1>Quét chữ bằng camera</h1>
<p>Bấm <b>Quét</b>, cho phép camera, rồi đưa dòng chữ vào khung xanh. Cần HTTPS hoặc localhost.</p>

<label for="ten">Họ tên (tiếng Việt)</label>
<div class="field"><input id="ten" type="text" data-camera-ocr></div>

<label for="ma">Mã số (chỉ số, in hoa)</label>
<div class="field"><input id="ma" type="text" data-camera-ocr data-lang="eng" data-whitelist="0123456789-" data-button-text="Quét mã"></div>

<label for="dc">Địa chỉ (nhiều dòng)</label>
<div class="field"><input id="dc" type="text" data-camera-ocr data-multiline></div>

<script src="camera-ocr.js"></script>
</body>
</html>
